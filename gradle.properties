# Project-wide Gradle settings.

# Memory: AGP + KSP can be hungry; 4 GB is comfortable for a small project.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Use the AndroidX libraries (Jetpack), not the legacy android.support.* ones.
android.useAndroidX=true

# Kotlin code style for IDE formatting.
kotlin.code.style=official

# Enable parallel/configuration cache for faster builds.
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Don't use the legacy Jetifier rewriter — we have no support-library deps.
android.enableJetifier=false
