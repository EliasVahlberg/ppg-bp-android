[project]
name = "ppg-bp-android-e2e"
version = "0.1.0"
description = "Device-in-the-loop end-to-end tests for ppg-bp-android, driven over adb"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["e2e"]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "e2e: requires a real connected Android device with a Polar sensor nearby (deselect with -m 'not e2e')",
]
